[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Openmail contributors"]
repository = "https://github.com/charlie-niekirk/openmail"
homepage = "https://github.com/charlie-niekirk/openmail"
publish = false

# Shared dependency versions. Crates opt in with `foo.workspace = true`.
# Add entries here when a PR first needs a dependency, not before.
[workspace.dependencies]
# GPUI is pre-1.0: pin exact, mutually compatible versions and upgrade them only in
# dedicated PRs. gpui-component 0.9.1 requires `gpui-pre =0.3.12` (the published
# GPUI snapshot), so `gpui` and `gpui-platform` are those packages under their
# usual names. `runtime_shaders` compiles Metal shaders at runtime, so macOS builds
# do not need the Xcode Metal toolchain.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
  "font-kit",
  "runtime_shaders",
  "wayland",
  "x11",
] }
gpui-component = "=0.9.1"
# Message-body webview. gpui-component's webview moved into its own crate,
# `gpui-webview`, released in lockstep with it and built on Longbridge's wry fork
# (`lb-wry`), which it does not re-export. Pin both exactly, alongside gpui-component.
gpui-webview = "=0.9.1"
wry = { package = "lb-wry", version = "=0.53.3" }

anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
keyring = "4.2.0"
oauth2 = { version = "5.0.0", default-features = false }
open = "5.4.5"
# rustls with the ring provider (already in the tree via gpui), not aws-lc-rs.
# SQLite, compiled in (`bundled`) so FTS5 and JSON are always available. 0.41
# bundles SQLite 3.54, which fixes RUSTSEC-2026-0459.
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "query",
  "rustls-no-provider",
  "system-proxy",
] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wiremock = "0.6.5"

# MIME parsing and building. `full_encoding` adds encoding_rs for the legacy
# multi-byte charsets (ISO-2022-JP, Shift_JIS, GB18030, Big5, …).
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
# Without `gethostname`: Message-IDs are generated on the sender's domain instead.
mail-builder = { version = "2.0.1", default-features = false }
insta = "1.49.0"

[workspace.lints.rust]
# Deny rather than forbid, so a crate that genuinely needs FFI (for example the
# webview bridge) can opt out locally with a justified `#[allow(unsafe_code)]`.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# "Pedantic-lite": a curated subset of clippy::pedantic that catches real
# issues without the noise of the full group.
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
