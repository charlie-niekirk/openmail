# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# CI runs `cargo deny --locked check advisories licenses`.

[graph]
all-features = true

[advisories]
version = 2
# Fail on any RustSec vulnerability, unmaintained or unsound advisory, and on
# yanked crates. Add justified exceptions to `ignore` as { id, reason }.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Licenses compatible with distributing Openmail as MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Don't fail just because an allowed license isn't used yet.
unused-allowed-license = "allow"

