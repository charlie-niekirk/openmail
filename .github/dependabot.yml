version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-patch-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned to exact git revisions; upgraded only in dedicated PRs.
      - dependency-name: gpui
      - dependency-name: gpui-component

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
